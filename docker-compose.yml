x-exercise: &exercise
  build:
    context: .
  entrypoint: /bin/sh

services:
  sync:
    image: "ghcr.io/skiller-whale/learnersync:0.2.8"
    network_mode: "host"
    environment:
      SERVER_URL: "https://train.skillerwhale.com/"
      SW_RUNNING_IN_HOSTED_ENV:
      WATCHER_BASE_PATH: "/exercises"
      ATTENDANCE_ID_FILE: "/attendance_id"
      WATCHED_EXTS: ".py"
      IGNORE_MATCH: ".git"
    volumes:
      - ./exercises:/exercises:ro
      - ./attendance_id:/attendance_id:ro
    tty: true
    stdin_open: true

  introduction_to_tdd:
    <<: *exercise
    volumes:
      - ./exercises/introduction_to_tdd:/introduction_to_tdd
      - introduction_to_tdd_pytest_cache:/introduction_to_tdd/.pytest_cache
      - introduction_to_tdd_src_pycache:/introduction_to_tdd/src/__pycache__
      - introduction_to_tdd_tests_pycache:/introduction_to_tdd/tests/__pycache__
    working_dir: /introduction_to_tdd
    environment:
      - PYTHONPATH=/introduction_to_tdd

  specifying_behaviour:
    <<: *exercise
    volumes:
      - ./exercises/specifying_behaviour:/specifying_behaviour
      - specifying_behaviour_pytest_cache:/specifying_behaviour/.pytest_cache
      - specifying_behaviour_src_pycache:/specifying_behaviour/src/__pycache__
      - specifying_behaviour_tests_pycache:/specifying_behaviour/tests/__pycache__
    working_dir: /specifying_behaviour
    environment:
      - PYTHONPATH=/specifying_behaviour

  failing_well:
    <<: *exercise
    volumes:
      - ./exercises/failing_well:/failing_well
      - failing_well_pytest_cache:/failing_well/.pytest_cache
      - failing_well_src_pycache:/failing_well/src/__pycache__
      - failing_well_tests_pycache:/failing_well/tests/__pycache__
    working_dir: /failing_well
    environment:
      - PYTHONPATH=/failing_well

  inside_out_tdd:
    <<: *exercise
    volumes:
      - ./exercises/inside_out_tdd:/inside_out_tdd
      - inside_out_tdd_pytest_cache:/inside_out_tdd/.pytest_cache
      - inside_out_tdd_src_pycache:/inside_out_tdd/src/__pycache__
      - inside_out_tdd_tests_pycache:/inside_out_tdd/tests/__pycache__
    working_dir: /inside_out_tdd
    environment:
      - PYTHONPATH=/inside_out_tdd

  outside_in_tdd:
    <<: *exercise
    volumes:
      - ./exercises/outside_in_tdd:/outside_in_tdd
      - outside_in_tdd_pytest_cache:/outside_in_tdd/.pytest_cache
      - outside_in_tdd_src_pycache:/outside_in_tdd/src/__pycache__
      - outside_in_tdd_tests_pycache:/outside_in_tdd/tests/__pycache__
    working_dir: /outside_in_tdd
    environment:
      - PYTHONPATH=/outside_in_tdd

  test_data:
    <<: *exercise
    volumes:
      - ./exercises/test_data:/test_data
      - test_data_pytest_cache:/test_data/.pytest_cache
      - test_data_src_pycache:/test_data/src/__pycache__
      - test_data_tests_pycache:/test_data/tests/__pycache__
      # `./wordle-stats` runs `python -m bin.wordle_stats`, so bin/ is imported too
      - test_data_bin_pycache:/test_data/bin/__pycache__
    working_dir: /test_data
    environment:
      - PYTHONPATH=/test_data

  legacy_code_sorting:
    <<: *exercise
    volumes:
      - ./exercises/legacy_code/sorting:/sorting
      - legacy_code_sorting_pytest_cache:/sorting/.pytest_cache
      - legacy_code_sorting_src_pycache:/sorting/src/__pycache__
      - legacy_code_sorting_tests_pycache:/sorting/tests/__pycache__
    working_dir: /sorting
    environment:
      - PYTHONPATH=/sorting

  legacy_code_shop:
    <<: *exercise
    volumes:
      - ./exercises/legacy_code/shop:/shop
      - legacy_code_shop_pytest_cache:/shop/.pytest_cache
      - legacy_code_shop_src_pycache:/shop/src/__pycache__
      - legacy_code_shop_tests_pycache:/shop/tests/__pycache__
    working_dir: /shop
    environment:
      - PYTHONPATH=/shop

  legacy_code_ai_shop:
    <<: *exercise
    volumes:
      - ./exercises/legacy_code/ai_shop:/ai_shop
      - legacy_code_ai_shop_pytest_cache:/ai_shop/.pytest_cache
      - legacy_code_ai_shop_src_pycache:/ai_shop/src/__pycache__
      - legacy_code_ai_shop_tests_pycache:/ai_shop/tests/__pycache__
    working_dir: /ai_shop
    environment:
      - PYTHONPATH=/ai_shop

  advanced_testing_mutation:
    <<: *exercise
    volumes:
      - ./exercises/advanced_testing/mutation:/mutation
      - advanced_testing_mutation_pytest_cache:/mutation/.pytest_cache
      - advanced_testing_mutation_pycache:/mutation/bun_and_board/__pycache__
      - advanced_testing_mutation_tests_pycache:/mutation/tests/__pycache__
    working_dir: /mutation
    environment:
      - PYTHONPATH=/mutation

  advanced_testing_pbt:
    <<: *exercise
    volumes:
      - ./exercises/advanced_testing/pbt:/pbt
      - advanced_testing_pbt_pytest_cache:/pbt/.pytest_cache
      - advanced_testing_pbt_pycache:/pbt/merge_sort/__pycache__
      - advanced_testing_pbt_tests_pycache:/pbt/tests/__pycache__
    working_dir: /pbt
    environment:
      - PYTHONPATH=/pbt

volumes:
  introduction_to_tdd_pytest_cache:
  introduction_to_tdd_src_pycache:
  introduction_to_tdd_tests_pycache:
  specifying_behaviour_pytest_cache:
  specifying_behaviour_src_pycache:
  specifying_behaviour_tests_pycache:
  failing_well_pytest_cache:
  failing_well_src_pycache:
  failing_well_tests_pycache:
  inside_out_tdd_pytest_cache:
  inside_out_tdd_src_pycache:
  inside_out_tdd_tests_pycache:
  outside_in_tdd_pytest_cache:
  outside_in_tdd_src_pycache:
  outside_in_tdd_tests_pycache:
  test_data_pytest_cache:
  test_data_src_pycache:
  test_data_tests_pycache:
  test_data_bin_pycache:
  legacy_code_sorting_pytest_cache:
  legacy_code_sorting_src_pycache:
  legacy_code_sorting_tests_pycache:
  legacy_code_shop_pytest_cache:
  legacy_code_shop_src_pycache:
  legacy_code_shop_tests_pycache:
  legacy_code_ai_shop_pytest_cache:
  legacy_code_ai_shop_src_pycache:
  legacy_code_ai_shop_tests_pycache:
  advanced_testing_mutation_pytest_cache:
  advanced_testing_mutation_pycache:
  advanced_testing_mutation_tests_pycache:
  advanced_testing_pbt_pytest_cache:
  advanced_testing_pbt_pycache:
  advanced_testing_pbt_tests_pycache:
